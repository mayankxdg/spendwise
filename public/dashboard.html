<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpendWise – Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body><div id="nav"></div>
<main class="container py-4">
  <h1 class="h3 mb-3">Dashboard</h1>
  <div class="row g-3 mb-3">
    <div class="col-md-4"><div class="card p-3"><div class="text-muted">Total income</div><div class="stat income" id="inc">–</div></div></div>
    <div class="col-md-4"><div class="card p-3"><div class="text-muted">Total expenses</div><div class="stat expense" id="exp">–</div></div></div>
    <div class="col-md-4"><div class="card p-3"><div class="text-muted">Balance (savings)</div><div class="stat" id="bal">–</div></div></div>
  </div>
  <div class="row g-3">
    <div class="col-lg-5"><div class="card p-3"><h2 class="h5">Spending by category</h2>
      <canvas id="pie" role="img" aria-label="Doughnut chart of spending by category"></canvas>
      <p class="text-muted d-none" id="pieEmpty">Add some expenses to see this chart.</p></div></div>
    <div class="col-lg-7"><div class="card p-3"><h2 class="h5">Monthly income vs expenses</h2>
      <canvas id="bar" role="img" aria-label="Bar chart of monthly income and expenses"></canvas></div></div>
  </div>
</main><div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/common.js"></script>
<script>
(async () => {
  const me = await api('/api/me'); renderLayout('dashboard.html', me.name);
  const s = await api('/api/summary');
  document.getElementById('inc').textContent = fmt(s.income);
  document.getElementById('exp').textContent = fmt(s.expense);
  const bal = document.getElementById('bal'); bal.textContent = fmt(s.balance); bal.classList.add(s.balance >= 0 ? 'income' : 'expense');

  if (!s.byCategory.length) document.getElementById('pieEmpty').classList.remove('d-none');
  else new Chart('pie', { type: 'doughnut', data: { labels: s.byCategory.map(c => c.category),
    datasets: [{ data: s.byCategory.map(c => c.total), backgroundColor: ['#0f766e','#f59e0b','#3b82f6','#ef4444','#8b5cf6','#10b981','#ec4899','#6b7280','#14b8a6'] }] } });

  new Chart('bar', { type: 'bar', data: { labels: s.monthly.map(m => m.month), datasets: [
    { label: 'Income', data: s.monthly.map(m => m.income), backgroundColor: '#15803d' },
    { label: 'Expenses', data: s.monthly.map(m => m.expense), backgroundColor: '#b91c1c' }] } });
})();
</script></body></html>
