<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpendWise – Transactions</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body><div id="nav"></div>
<main class="container py-4">
  <h1 class="h3 mb-3">Transactions</h1>
  <div class="row g-3">
    <div class="col-lg-4"><div class="card p-3">
      <h2 class="h5" id="formTitle">Add transaction</h2>
      <div id="msg" class="alert d-none" role="alert"></div>
      <form id="txnForm" novalidate>
        <input type="hidden" id="editId">
        <div class="mb-2"><label class="form-label" for="type">Type</label>
          <select id="type" class="form-select"><option value="expense">Expense</option><option value="income">Income</option></select></div>
        <div class="mb-2"><label class="form-label" for="category">Category</label><select id="category" class="form-select"></select></div>
        <div class="mb-2"><label class="form-label" for="amount">Amount (₹)</label><input id="amount" type="number" step="0.01" min="0.01" class="form-control"></div>
        <div class="mb-2"><label class="form-label" for="date">Date</label><input id="date" type="date" class="form-control"></div>
        <div class="mb-3"><label class="form-label" for="note">Note (optional)</label><input id="note" maxlength="120" class="form-control"></div>
        <button class="btn btn-brand" id="saveBtn">Save</button>
        <button type="button" class="btn btn-outline-secondary d-none" id="cancelBtn">Cancel edit</button>
      </form></div></div>
    <div class="col-lg-8"><div class="card p-3">
      <form class="row g-2 mb-3" id="filterForm">
        <div class="col-sm-3"><label class="form-label small" for="fCat">Category</label><select id="fCat" class="form-select form-select-sm"><option value="">All</option></select></div>
        <div class="col-sm-3"><label class="form-label small" for="fType">Type</label><select id="fType" class="form-select form-select-sm"><option value="">All</option><option value="income">Income</option><option value="expense">Expense</option></select></div>
        <div class="col-sm-3"><label class="form-label small" for="fFrom">From</label><input id="fFrom" type="date" class="form-control form-control-sm"></div>
        <div class="col-sm-3"><label class="form-label small" for="fTo">To</label><input id="fTo" type="date" class="form-control form-control-sm"></div>
      </form>
      <div class="table-responsive"><table class="table table-hover align-middle">
        <thead><tr><th>Date</th><th>Category</th><th>Note</th><th class="text-end">Amount</th><th></th></tr></thead>
        <tbody id="rows"></tbody></table></div>
      <p id="empty" class="text-muted d-none">No transactions match these filters.</p>
    </div></div>
  </div>
</main><div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script>
const $ = id => document.getElementById(id), msg = $('msg'); let cache = [];
(async () => {
  const me = await api('/api/me'); renderLayout('transactions.html', me.name);
  me.categories.forEach(c => { $('category').add(new Option(c, c)); $('fCat').add(new Option(c, c)); });
  $('date').value = new Date().toISOString().slice(0, 10);
  load();
})();

async function load() {
  const q = new URLSearchParams();
  [['category','fCat'],['type','fType'],['from','fFrom'],['to','fTo']].forEach(([k, id]) => $(id).value && q.set(k, $(id).value));
  cache = await api('/api/transactions?' + q);
  $('empty').classList.toggle('d-none', cache.length > 0);
  $('rows').innerHTML = cache.map(t => `<tr><td>${t.date}</td><td>${esc(t.category)}</td><td>${esc(t.note)}</td>
    <td class="text-end ${t.type}">${t.type === 'income' ? '+' : '-'}${fmt(t.amount)}</td>
    <td class="text-end text-nowrap"><button class="btn btn-sm btn-outline-primary" onclick="edit(${t.id})">Edit</button>
    <button class="btn btn-sm btn-outline-danger" onclick="del(${t.id})">Delete</button></td></tr>`).join('');
}
['fCat','fType','fFrom','fTo'].forEach(id => $(id).addEventListener('change', load));

// ---- client-side validation ----
function validate() {
  const a = Number($('amount').value);
  if (!$('amount').value || a <= 0) return 'Enter an amount greater than 0.';
  if (!$('date').value) return 'Pick a date.';
  if ($('note').value.length > 120) return 'Note is too long (max 120).';
  return null;
}
$('txnForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = validate(); if (err) return showAlert(msg, err);
  const body = { type: $('type').value, category: $('category').value, amount: $('amount').value, date: $('date').value, note: $('note').value };
  const id = $('editId').value;
  try {
    await api(id ? '/api/transactions/' + id : '/api/transactions', id ? 'PUT' : 'POST', body);
    resetForm(); showAlert(msg, id ? 'Transaction updated.' : 'Transaction added.', 'success'); load();
  } catch (ex) { showAlert(msg, ex.message); }
});
function edit(id) {
  const t = cache.find(x => x.id === id);
  $('editId').value = id; $('type').value = t.type; $('category').value = t.category;
  $('amount').value = t.amount; $('date').value = t.date; $('note').value = t.note;
  $('formTitle').textContent = 'Edit transaction'; $('cancelBtn').classList.remove('d-none'); window.scrollTo(0, 0);
}
async function del(id) {
  if (!confirm('Delete this transaction?')) return;
  await api('/api/transactions/' + id, 'DELETE'); load();
}
function resetForm() {
  $('txnForm').reset(); $('editId').value = ''; $('date').value = new Date().toISOString().slice(0, 10);
  $('formTitle').textContent = 'Add transaction'; $('cancelBtn').classList.add('d-none');
}
$('cancelBtn').onclick = resetForm;
</script></body></html>
